<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 240px;
      padding: 16px;
      background: #fff;
      color: #111;
      font-size: 13px;
    }
    h1 { font-size: 14px; font-weight: 700; margin: 0 0 6px; color: #26a69a; }
    p  { color: #555; margin: 0 0 10px; font-size: 12px; line-height: 1.5; }
    .step { display: flex; gap: 8px; margin-bottom: 8px; font-size: 12px; color: #444; }
    .step-num { background: #26a69a; color: #fff; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
    .note { background: #f0faf9; border-radius: 6px; padding: 8px 10px; font-size: 11px; color: #26a69a; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>⚡ SoloXSnaps Autofill</h1>
  <p>Auto-fills PixiSet invoices &amp; contracts from your inquiries.</p>
  <div class="step"><span class="step-num">1</span><span>Go to a PixiSet invoice or contract page</span></div>
  <div class="step"><span class="step-num">2</span><span>Click the teal <strong>⚡ Autofill</strong> button in the bottom-right</span></div>
  <div class="step"><span class="step-num">3</span><span>Pick a client → click Fill</span></div>
  <div class="note">Connected to your Supabase — no setup needed.</div>
</body>
</html>
